<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página no encontrada — Loialt Energy</title>
<!-- Una 404 propia evita que el visitante caiga en la pantalla genérica del
     hosting, que no tiene marca ni salida. `noindex` porque una página de error
     no debe aparecer nunca en el buscador. -->
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="./public/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0A0E14" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0A0E14; --ink:#eaf0f7; --muted:#8b9bb0; --energy:#82bd67; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:'Inter',system-ui,sans-serif;
        display:flex; align-items:center; justify-content:center;
        padding:2rem; text-align:center; -webkit-font-smoothing:antialiased; }
  .caja{ max-width:32rem; }
  .cod{ font-family:'JetBrains Mono',monospace; font-size:.75rem; letter-spacing:.22em;
        text-transform:uppercase; color:var(--energy); margin-bottom:1.25rem; }
  h1{ font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700;
      font-size:clamp(1.75rem,5vw,2.5rem); line-height:1.15; letter-spacing:-.02em;
      margin:0 0 .875rem; }
  p{ color:var(--muted); line-height:1.7; margin:0 0 2rem; }
  .btn{ display:inline-block; background:var(--energy); color:#021838;
        font-weight:600; text-decoration:none; padding:.8rem 1.6rem;
        border-radius:2rem; transition:transform .25s, filter .25s; }
  .btn:hover{ transform:translateY(-2px); filter:brightness(1.08); }
  .otros{ margin-top:2.25rem; font-size:.85rem; }
  .otros a{ color:var(--muted); text-decoration:none; margin:0 .5rem; }
  .otros a:hover{ color:var(--energy); }
</style>
</head>
<body>
  <div class="caja">
    <div class="cod">Error 404</div>
    <h1>Esta página no existe.</h1>
    <p>
      El enlace que seguiste no lleva a ningún sitio, o la página cambió de lugar.
      Desde la portada puedes ver todo lo que hacemos.
    </p>
    <a class="btn" href="/">Ir a la portada</a>
    <div class="otros">
      <a href="/#what">Solución</a>·<a href="/#servicio">Servicio</a>·<a href="/#productos">Productos</a>·<a href="/#faq">Preguntas frecuentes</a>
    </div>
  </div>
</body>
</html>
